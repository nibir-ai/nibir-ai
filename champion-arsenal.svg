<svg width="760" height="270" viewBox="0 0 760 270" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Champion Arsenal</title>
  <desc id="desc">A champion select style panel listing Python, TypeScript, and Shell mastery roles.</desc>
  <defs>
    <linearGradient id="ca-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#010a13"/>
      <stop offset="0.5" stop-color="#081a28"/>
      <stop offset="1" stop-color="#020812"/>
    </linearGradient>
    <linearGradient id="ca-header" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="0.5" stop-color="#10283a"/>
      <stop offset="1" stop-color="#06111d"/>
    </linearGradient>
    <linearGradient id="ca-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6b4b1f"/>
      <stop offset="0.48" stop-color="#c89b3c"/>
      <stop offset="1" stop-color="#f0e6d2"/>
