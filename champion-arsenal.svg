      <text x="380" y="211" font-size="13" font-weight="700" fill="#c89b3c" text-anchor="middle">MASTERY 6</text>
      <text x="380" y="229" font-size="11" fill="#a09b8c" text-anchor="middle">MIDLANER / MAGE</text>

