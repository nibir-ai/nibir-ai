<svg width="1600" height="1080" viewBox="0 0 1600 1080" xmlns="http://www.w3.org/2000/svg" fill="none">
<rect width="1600" height="1080" rx="28" fill="#090B10"/>
<text x="110" y="110" fill="#FFB874" font-size="18" font-family="Inter, Arial" letter-spacing="4">SELECTED WORK / FOUR PROJECTS</text>
<text x="110" y="166" fill="#F2EEE6" font-size="62" font-family="Georgia, serif" font-weight="700">The work should carry the introduction.</text>
<text x="110" y="213" fill="#A9B3C1" font-size="23" font-family="Inter, Arial">Not everything I make belongs here. These do.</text>
<rect x="110" y="280" width="655" height="260" rx="30" fill="#0F141D" stroke="#253041"/><rect x="138" y="308" width="150" height="14" rx="7" fill="#FF8A3D" opacity="0.95"/><text x="138" y="362" fill="#F2EEE6" font-size="38" font-family="Georgia, serif" font-weight="700">Relay</text><text x="138" y="397" fill="#FF8A3D" font-size="18" font-family="Inter, Arial" letter-spacing="2.2">API WORKFLOWS AND DEVELOPER COMMUNICATION</text><text x="138" y="435" fill="#B5BECA" font-size="20" font-family="Inter, Arial">Brings testing, endpoint readiness, and</text><text x="138" y="463" fill="#B5BECA" font-size="20" font-family="Inter, Arial">team handoff into one place. Built for the</text><text x="138" y="491" fill="#B5BECA" font-size="20" font-family="Inter, Arial">moment when an API technically exists but</text><text x="138" y="519" fill="#B5BECA" font-size="20" font-family="Inter, Arial">still is not actually usable by the next person.</text><rect x="138" y="490" width="200" height="34" rx="17" fill="#131B27" stroke="#2B3648"/><text x="155" y="512" fill="#E7EBF1" font-size="17" font-family="Inter, Arial">REPO ↗ relay</text><rect x="835" y="280" width="655" height="260" rx="30" fill="#0F141D" stroke="#253041"/><rect x="863" y="308" width="150" height="14" rx="7" fill="#6AA4FF" opacity="0.95"/><text x="863" y="362" fill="#F2EEE6" font-size="38" font-family="Georgia, serif" font-weight="700">datasetvision</text><text x="863" y="397" fill="#6AA4FF" font-size="18" font-family="Inter, Arial" letter-spacing="2.2">COMPUTER VISION DATASET AUDITING</text><text x="863" y="435" fill="#B5BECA" font-size="20" font-family="Inter, Arial">Inspects anomalies, duplicates, corruption,</text><text x="863" y="463" fill="#B5BECA" font-size="20" font-family="Inter, Arial">and drift before those problems turn into</text><text x="863" y="491" fill="#B5BECA" font-size="20" font-family="Inter, Arial">bad experiments and misleading</text><text x="863" y="519" fill="#B5BECA" font-size="20" font-family="Inter, Arial">model results.</text><rect x="863" y="490" width="200" height="34" rx="17" fill="#131B27" stroke="#2B3648"/><text x="880" y="512" fill="#E7EBF1" font-size="17" font-family="Inter, Arial">REPO ↗ datasetvision</text><rect x="110" y="620" width="655" height="260" rx="30" fill="#0F141D" stroke="#253041"/><rect x="138" y="648" width="150" height="14" rx="7" fill="#9AE6B4" opacity="0.95"/><text x="138" y="702" fill="#F2EEE6" font-size="38" font-family="Georgia, serif" font-weight="700">micro-tensor</text><text x="138" y="737" fill="#9AE6B4" font-size="18" font-family="Inter, Arial" letter-spacing="2.2">FIRST-PRINCIPLES ML</text><text x="138" y="775" fill="#B5BECA" font-size="20" font-family="Inter, Arial">A small autograd engine built by hand,</text><text x="138" y="803" fill="#B5BECA" font-size="20" font-family="Inter, Arial">because understanding the machinery matters</text><text x="138" y="831" fill="#B5BECA" font-size="20" font-family="Inter, Arial">more to me than importing mystery.</text><rect x="138" y="830" width="200" height="34" rx="17" fill="#131B27" stroke="#2B3648"/><text x="155" y="852" fill="#E7EBF1" font-size="17" font-family="Inter, Arial">REPO ↗ micro-tensor</text><rect x="835" y="620" width="655" height="260" rx="30" fill="#0F141D" stroke="#253041"/><rect x="863" y="648" width="150" height="14" rx="7" fill="#FFC857" opacity="0.95"/><text x="863" y="702" fill="#F2EEE6" font-size="38" font-family="Georgia, serif" font-weight="700">XBMind</text><text x="863" y="737" fill="#FFC857" font-size="18" font-family="Inter, Arial" letter-spacing="2.2">LOCAL VOICE INTELLIGENCE</text><text x="863" y="775" fill="#B5BECA" font-size="20" font-family="Inter, Arial">An experiment in turning an ordinary</text><text x="863" y="803" fill="#B5BECA" font-size="20" font-family="Inter, Arial">Bluetooth speaker into an offline AI smart</text><text x="863" y="831" fill="#B5BECA" font-size="20" font-family="Inter, Arial">speaker using speech recognition, local</text><text x="863" y="859" fill="#B5BECA" font-size="20" font-family="Inter, Arial">LLMs, and TTS.</text><rect x="863" y="830" width="200" height="34" rx="17" fill="#131B27" stroke="#2B3648"/><text x="880" y="852" fill="#E7EBF1" font-size="17" font-family="Inter, Arial">REPO ↗ XBMind</text></svg>