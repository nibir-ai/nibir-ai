<svg width="1600" height="1020" viewBox="0 0 1600 1020" xmlns="http://www.w3.org/2000/svg" fill="none">
<rect width="1600" height="1020" rx="28" fill="#090B10"/>
<text x="110" y="110" fill="#FFB874" font-size="18" font-family="Inter, Arial" letter-spacing="4">METHOD / TASTE / PRACTICE</text>
<text x="110" y="166" fill="#F2EEE6" font-size="60" font-family="Georgia, serif" font-weight="700">How I like software to feel.</text>
<text x="110" y="212" fill="#A9B3C1" font-size="23" font-family="Inter, Arial">Good engineering. Good interface sense. Good writing. The same craft, seen from different angles.</text>
<rect x="110" y="280" width="420" height="582" rx="30" fill="#0F141D" stroke="#253041"/>
<text x="145" y="332" fill="#9AE6B4" font-size="17" font-family="Inter, Arial" letter-spacing="3">WORKING PRINCIPLES</text>
<rect x="145" y="366" width="12" height="12" rx="6" fill="#9AE6B4"/><text x="175" y="390" fill="#F2EEE6" font-size="28" font-family="Inter, Arial">Understand the machinery.</text><rect x="145" y="440" width="12" height="12" rx="6" fill="#9AE6B4"/><text x="175" y="464" fill="#F2EEE6" font-size="28" font-family="Inter, Arial">Design for clarity, not spectacle alone.</text><rect x="145" y="514" width="12" height="12" rx="6" fill="#9AE6B4"/><text x="175" y="538" fill="#F2EEE6" font-size="28" font-family="Inter, Arial">Prefer local ownership where possible.</text><rect x="145" y="588" width="12" height="12" rx="6" fill="#9AE6B4"/><text x="175" y="612" fill="#F2EEE6" font-size="28" font-family="Inter, Arial">Make complex things approachable.</text><rect x="145" y="662" width="12" height="12" rx="6" fill="#9AE6B4"/><text x="175" y="686" fill="#F2EEE6" font-size="28" font-family="Inter, Arial">Let documentation do real work.</text><rect x="145" y="736" width="12" height="12" rx="6" fill="#9AE6B4"/><text x="175" y="760" fill="#F2EEE6" font-size="28" font-family="Inter, Arial">Leave room for atmosphere.</text><rect x="565" y="280" width="455" height="582" rx="30" fill="#0F141D" stroke="#253041"/><text x="600" y="332" fill="#FFC857" font-size="17" font-family="Inter, Arial" letter-spacing="3">BUILDING MATERIALS</text><text x="600" y="390" fill="#F2EEE6" font-size="27" font-family="Georgia, serif" font-weight="700">Languages</text><text x="600" y="424" fill="#B5BECA" font-size="21" font-family="Inter, Arial">Python · TypeScript · Bash · SQL</text><text x="600" y="485" fill="#F2EEE6" font-size="27" font-family="Georgia, serif" font-weight="700">ML stack</text><text x="600" y="519" fill="#B5BECA" font-size="21" font-family="Inter, Arial">PyTorch · NumPy · OpenCV · local model tooling</text><text x="600" y="580" fill="#F2EEE6" font-size="27" font-family="Georgia, serif" font-weight="700">Systems</text><text x="600" y="614" fill="#B5BECA" font-size="21" font-family="Inter, Arial">Git · Linux · Docker · APIs · CLI applications</text><text x="600" y="675" fill="#F2EEE6" font-size="27" font-family="Georgia, serif" font-weight="700">Exploring</text><text x="600" y="709" fill="#B5BECA" font-size="21" font-family="Inter, Arial">RAG · MCP · LangChain · LangGraph · agent architectures</text><text x="600" y="770" fill="#F2EEE6" font-size="27" font-family="Georgia, serif" font-weight="700">Biases</text><text x="600" y="804" fill="#B5BECA" font-size="21" font-family="Inter, Arial">Readable interfaces · honest docs · useful abstractions</text><rect x="1055" y="280" width="435" height="582" rx="30" fill="#0F141D" stroke="#253041"/><text x="1090" y="332" fill="#6AA4FF" font-size="17" font-family="Inter, Arial" letter-spacing="3">A FEW STUDIO NOTES</text><text x="1090" y="395" fill="#F2EEE6" font-size="28" font-family="Georgia, serif">“No skill bars. No fake mastery”</text><text x="1090" y="429" fill="#F2EEE6" font-size="28" font-family="Georgia, serif">“scores.”</text><text x="1090" y="499" fill="#F2EEE6" font-size="28" font-family="Georgia, serif">“If a README cannot explain the”</text><text x="1090" y="533" fill="#F2EEE6" font-size="28" font-family="Georgia, serif">“project, the UI should not have”</text><text x="1090" y="567" fill="#F2EEE6" font-size="28" font-family="Georgia, serif">“to guess.”</text><text x="1090" y="637" fill="#F2EEE6" font-size="28" font-family="Georgia, serif">“The best technical work often”</text><text x="1090" y="671" fill="#F2EEE6" font-size="28" font-family="Georgia, serif">“feels calm, even when the”</text><text x="1090" y="705" fill="#F2EEE6" font-size="28" font-family="Georgia, serif">“machinery is difficult.”</text><text x="1090" y="775" fill="#F2EEE6" font-size="28" font-family="Georgia, serif">“I like software with a point of”</text><text x="1090" y="809" fill="#F2EEE6" font-size="28" font-family="Georgia, serif">“view.”</text></svg>