<svg width="1600" height="980" viewBox="0 0 1600 980" xmlns="http://www.w3.org/2000/svg" fill="none">
<rect width="1600" height="980" rx="28" fill="#090B10"/>
<text x="110" y="110" fill="#FFB874" font-size="18" font-family="Inter, Arial" letter-spacing="4">CURRENT FOCUS / THE STUDIO FLOOR</text>
<text x="110" y="166" fill="#F2EEE6" font-size="60" font-family="Georgia, serif" font-weight="700">What I am thinking about now.</text>
<text x="110" y="212" fill="#A9B3C1" font-size="23" font-family="Inter, Arial">A little more alive than a static biography. A little more honest than a polished claim.</text>
<rect x="110" y="270" width="630" height="560" rx="30" fill="#0F141D" stroke="#253041"/>
<text x="145" y="320" fill="#6AA4FF" font-size="17" font-family="Inter, Arial" letter-spacing="3">ACTIVE TRACK 01</text>
<text x="145" y="366" fill="#F2EEE6" font-size="38" font-family="Georgia, serif" font-weight="700">SpectraAgent-Nd</text>
<text x="145" y="404" fill="#CCD3DD" font-size="20" font-family="Inter, Arial">M.Tech research into AI-assisted interpretation of spectral data</text>
<text x="145" y="432" fill="#CCD3DD" font-size="20" font-family="Inter, Arial">for neodymium-bearing material detection, with emphasis on</text>
<text x="145" y="460" fill="#CCD3DD" font-size="20" font-family="Inter, Arial">clearer reasoning, usable workflows, and evidence-aware outputs.</text>
<rect x="145" y="510" width="234" height="36" rx="18" fill="#121B27" stroke="#2A3548"/><text x="165" y="534" fill="#E9EEF6" font-size="17" font-family="Inter, Arial">research / spectral intelligence</text>
<text x="145" y="602" fill="#FFC857" font-size="17" font-family="Inter, Arial" letter-spacing="3">ACTIVE TRACK 02</text>
<text x="145" y="648" fill="#F2EEE6" font-size="38" font-family="Georgia, serif" font-weight="700">ConsoleShell</text>
<text x="145" y="686" fill="#CCD3DD" font-size="20" font-family="Inter, Arial">A controller-first desktop launcher idea for PC gaming:</text>
<text x="145" y="714" fill="#CCD3DD" font-size="20" font-family="Inter, Arial">console-grade UI, keyboard support, local ownership, and</text>
<text x="145" y="742" fill="#CCD3DD" font-size="20" font-family="Inter, Arial">no-account-first product thinking. More product vision than release.</text>
<rect x="145" y="780" width="242" height="36" rx="18" fill="#121B27" stroke="#2A3548"/><text x="165" y="804" fill="#E9EEF6" font-size="17" font-family="Inter, Arial">product concept / UI systems</text>
<rect x="785" y="270" width="705" height="560" rx="30" fill="#0F141D" stroke="#253041"/>
<text x="820" y="320" fill="#FF6F91" font-size="17" font-family="Inter, Arial" letter-spacing="3">THREADS THAT KEEP RETURNING</text>
<circle cx="838" cy="380" r="6" fill="#FF8A3D"/><text x="860" y="390" fill="#F2EEE6" font-size="28" font-family="Inter, Arial" font-weight="600">Agentic software</text><text x="860" y="418" fill="#B5BECA" font-size="19" font-family="Inter, Arial">How do we make agents useful, inspectable,</text><text x="860" y="442" fill="#B5BECA" font-size="19" font-family="Inter, Arial">and less theatrical?</text><circle cx="838" cy="486" r="6" fill="#FF8A3D"/><text x="860" y="496" fill="#F2EEE6" font-size="28" font-family="Inter, Arial" font-weight="600">RAG and context</text><text x="860" y="524" fill="#B5BECA" font-size="19" font-family="Inter, Arial">How can models cite, retrieve, and reason</text><text x="860" y="548" fill="#B5BECA" font-size="19" font-family="Inter, Arial">without turning evidence into decoration?</text><circle cx="838" cy="592" r="6" fill="#FF8A3D"/><text x="860" y="602" fill="#F2EEE6" font-size="28" font-family="Inter, Arial" font-weight="600">Model internals</text><text x="860" y="630" fill="#B5BECA" font-size="19" font-family="Inter, Arial">What becomes intuitive once you rebuild</text><text x="860" y="654" fill="#B5BECA" font-size="19" font-family="Inter, Arial">the moving parts yourself?</text><circle cx="838" cy="698" r="6" fill="#FF8A3D"/><text x="860" y="708" fill="#F2EEE6" font-size="28" font-family="Inter, Arial" font-weight="600">Developer experience</text><text x="860" y="736" fill="#B5BECA" font-size="19" font-family="Inter, Arial">Can tools reduce coordination overhead</text><text x="860" y="760" fill="#B5BECA" font-size="19" font-family="Inter, Arial">instead of adding another layer of ceremony?</text><circle cx="838" cy="804" r="6" fill="#FF8A3D"/><text x="860" y="814" fill="#F2EEE6" font-size="28" font-family="Inter, Arial" font-weight="600">Local-first systems</text><text x="860" y="842" fill="#B5BECA" font-size="19" font-family="Inter, Arial">How much software can stay private, responsive,</text><text x="860" y="866" fill="#B5BECA" font-size="19" font-family="Inter, Arial">and owned by the user?</text></svg>