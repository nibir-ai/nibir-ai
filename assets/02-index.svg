="#0F141D" stroke="#253041"/><rect x="859" y="560" width="104" height="104" rx="18" fill="#111826" stroke="#2A3548"/><text x="888" y="626" fill="#FFC857" font-size="34" font-family="Georgia, serif" font-weight="700">04</text><text x="989" y="610" fill="#F2EEE6" font-size="34" font-family="Inter, Arial" font-weight="600">Toolbox</text><text x="989" y="647" fill="#AEB7C5" font-size="21" font-family="Inter, Arial">The languages, frameworks, and building</text><text x="989" y="675" fill="#AEB7C5" font-size="21" font-family="Inter, Arial">materials I actually reach for.</text><rect x="110" y="770" width="655" height="180" rx="26" fill="#0F141D" stroke="#253041"/><rect x="134" y="795" width="104" height="104" rx="18" fill="#111826" stroke="#2A3548"/><text x="163" y="861" fill="#FF6F91" font-size="34" font-family="Georgia, serif" font-weight="700">05</text><text x="264" y="845" fill="#F2EEE6" font-size="34" font-family="Inter, Arial" font-weight="600">Studio notes</text><text x="264" y="882" fill="#AEB7C5" font-size="21" font-family="Inter, Arial">Short observations, philosophy, and the</text><text x="264" y="910" fill="#AEB7C5" font-size="21" font-family="Inter, Arial">through-lines behind the work.</text><rect x="835" y="770" width="655" height="180" rx="26" fill="#0F141D" stroke="#253041"/><rect x="859" y="795" width="104" height="104" rx="18" fill="#111826" stroke="#2A3548"/><text x="888" y="861" fill="#C8A6FF" font-size="34" font-family="Georgia, serif" font-weight="700">06</text><text x="989" y="845" fill="#F2EEE6" font-size="34" font-family="Inter, Arial" font-weight="600">After hours</text><text x="989" y="882" fill="#AEB7C5" font-size="21" font-family="Inter, Arial">Games, music, fiction, and the aesthetic</text><text x="989" y="910" fill="#AEB7C5" font-size="21" font-family="Inter, Arial">instincts that leak into code.</text></svg>