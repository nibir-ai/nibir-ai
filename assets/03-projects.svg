<svg width="1400" height="980" viewBox="0 0 1400 980" xmlns="http://www.w3.org/2000/svg" fill="none">
<rect width="1400" height="980" rx="28" fill="#07090E"/>
<text x="80" y="88" fill="#9FA9BC" font-size="15" font-family="Inter, Segoe UI, Arial" letter-spacing="3">SELECTED WORK / THE GOOD STUFF</text>
<text x="80" y="140" fill="#F5F7FB" font-size="58" font-family="Inter, Segoe UI, Arial" font-weight="800">projects i actually want in the intro.</text>
<text x="80" y="182" fill="#A6B0C3" font-size="23" font-family="Inter, Segoe UI, Arial">a tighter, more current presentation — less corporate, more internet-native.</text>
<rect x="80" y="250" width="600" height="250" rx="28" fill="#0D121B" stroke="#222A39"/><rect x="106" y="276" width="120" height="36" rx="18" fill="#111827" stroke="#273042"/><text x="126" y="299" fill="#8B5CF6" font-size="14" font-family="Inter, Segoe UI, Arial" letter-spacing="2">DEVELOPER TOOLS</text><text x="106" y="358" fill="#F5F7FB" font-size="42" font-family="Inter, Segoe UI, Arial" font-weight="800">relay</text><text x="106" y="400" fill="#AEB8CA" font-size="20" font-family="Inter, Segoe UI, Arial">api testing + team handoff</text><text x="106" y="428" fill="#AEB8CA" font-size="20" font-family="Inter, Segoe UI, Arial">built around the gap between “the endpoint exists”</text><text x="106" y="456" fill="#AEB8CA" font-size="20" font-family="Inter, Segoe UI, Arial">and “the endpoint is ready for someone else”.</text><text x="106" y="474" fill="#7E8AA1" font-size="16" font-family="Inter, Segoe UI, Arial">github.com/nibir-ai/relay</text><rect x="720" y="250" width="600" height="250" rx="28" fill="#0D121B" stroke="#222A39"/><rect x="746" y="276" width="120" height="36" rx="18" fill="#111827" stroke="#273042"/><text x="766" y="299" fill="#4DA3FF" font-size="14" font-family="Inter, Segoe UI, Arial" letter-spacing="2">COMPUTER VISION TOOLING</text><text x="746" y="358" fill="#F5F7FB" font-size="42" font-family="Inter, Segoe UI, Arial" font-weight="800">datasetvision</text><text x="746" y="400" fill="#AEB8CA" font-size="20" font-family="Inter, Segoe UI, Arial">audits datasets for anomalies, duplicates, corruption,</text><text x="746" y="428" fill="#AEB8CA" font-size="20" font-family="Inter, Segoe UI, Arial">and drift before those issues turn into bad model work.</text><text x="746" y="474" fill="#7E8AA1" font-size="16" font-family="Inter, Segoe UI, Arial">github.com/nibir-ai/datasetvision</text><rect x="80" y="580" width="600" height="250" rx="28" fill="#0D121B" stroke="#222A39"/><rect x="106" y="606" width="120" height="36" rx="18" fill="#111827" stroke="#273042"/><text x="126" y="629" fill="#34D399" font-size="14" font-family="Inter, Segoe UI, Arial" letter-spacing="2">FIRST-PRINCIPLES ML</text><text x="106" y="688" fill="#F5F7FB" font-size="42" font-family="Inter, Segoe UI, Arial" font-weight="800">micro-tensor</text><text x="106" y="730" fill="#AEB8CA" font-size="20" font-family="Inter, Segoe UI, Arial">a tiny autograd engine made for understanding</text><text x="106" y="758" fill="#AEB8CA" font-size="20" font-family="Inter, Segoe UI, Arial">the machinery instead of importing mystery.</text><text x="106" y="804" fill="#7E8AA1" font-size="16" font-family="Inter, Segoe UI, Arial">github.com/nibir-ai/micro-tensor</text><rect x="720" y="580" width="600" height="250" rx="28" fill="#0D121B" stroke="#222A39"/><rect x="746" y="606" width="120" height="36" rx="18" fill="#111827" stroke="#273042"/><text x="766" y="629" fill="#FF9A3D" font-size="14" font-family="Inter, Segoe UI, Arial" letter-spacing="2">LOCAL VOICE AI</text><text x="746" y="688" fill="#F5F7FB" font-size="42" font-family="Inter, Segoe UI, Arial" font-weight="800">xbmind</text><text x="746" y="730" fill="#AEB8CA" font-size="20" font-family="Inter, Segoe UI, Arial">an offline ai speaker experiment using local stt,</text><text x="746" y="758" fill="#AEB8CA" font-size="20" font-family="Inter, Segoe UI, Arial">local llms, and tts on everyday hardware.</text><text x="746" y="804" fill="#7E8AA1" font-size="16" font-family="Inter, Segoe UI, Arial">github.com/nibir-ai/xbmind</text></svg>